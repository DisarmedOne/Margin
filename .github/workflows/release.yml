# Pushing a tag like v1.5.3 builds Margin and publishes the GitHub release the updater reads.
# "Run workflow" in the Actions tab only tests and builds, it releases nothing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npx electron-builder --win nsis --publish never
      # One gh call creates the release and uploads everything; electron-builder's own publish raced itself (422).
      - name: Publish release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.exe.blockmap dist/latest.yml --title "${GITHUB_REF_NAME#v}" --generate-notes --latest --verify-tag
